stages:
  - lint
  - test
  - docker

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  LINUX_IMAGE: arch

before_script:
  - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.integrasources.com/".insteadOf "https://gitlab.integrasources.com/"

config-check:
  stage: lint
  image: ${CI_REGISTRY_IMAGE}:${LINUX_IMAGE}
  script:
    - pre-commit run --all-files
    - if [ -f ci-shared/.pre-commit-config.yaml ]; then diff -q .pre-commit-config.yaml ci-shared/.pre-commit-config.yaml; fi
    - if [ -f ci-shared/.clang-format ]; then diff -q .clang-format ci-shared/.clang-format; fi
    - if [ -f ci-shared/.clang-tidy ]; then diff -q .clang-tidy ci-shared/.clang-tidy; fi

pre-commit:
  stage: lint
  image: ${CI_REGISTRY_IMAGE}:${LINUX_IMAGE}
  script:
    - pre-commit run --all-files

.test_job:
  stage: test
  image: ${CI_REGISTRY_IMAGE}:${LINUX_IMAGE}
  script:
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${CXX_COMPILER} -DFETCHCONTENT_SOURCE_DIR_GOOGLETEST=/opt/deps/googletest-src
    - cmake --build build -j
    - cd build && ctest --output-on-failure

build gcc:
  extends: .test_job
  variables:
    CXX_COMPILER: g++

build clang:
  extends: .test_job
  variables:
    CXX_COMPILER: clang++

docker:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$LINUX_IMAGE -f ci-shared/Dockerfile ci-shared/
    - docker push $CI_REGISTRY_IMAGE:$LINUX_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  timeout: 30m
